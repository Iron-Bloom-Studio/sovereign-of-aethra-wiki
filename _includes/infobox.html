<aside class="infobox" aria-label="Article facts">
  <h2>{{ page.infobox.name | default: page.title }}</h2>
  {% if page.infobox.image %}<a class="lightbox-link" href="{{ page.infobox.image | relative_url }}" data-lightbox data-caption="{{ page.infobox.image_alt | default: page.title }}"><img loading="lazy" src="{{ page.infobox.image | relative_url }}" alt="{{ page.infobox.image_alt | default: page.title }}"></a>{% else %}<div class="artwork-placeholder">Artwork Not Yet Publicly Available</div>{% endif %}
  <dl>{% for item in page.infobox.fields %}<dt>{{ item[0] }}</dt><dd>{{ item[1] }}</dd>{% endfor %}</dl>
</aside>
