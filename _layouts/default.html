<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <title>{{ page.title | default: site.title }} · {{ site.title }}</title>
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/wiki/favicon.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/wiki/wiki.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#article">Skip to article</a>
    <header class="site-header"><a class="wordmark" href="{{ '/wiki/' | relative_url }}">Sovereign of Aethra<span>Ancient Aethra Archive</span></a><button class="menu-toggle" aria-expanded="false" aria-controls="site-nav">Browse</button><label class="search"><span class="sr-only">Search wiki</span><input id="wiki-search" type="search" placeholder="Search the archive" autocomplete="off"><span id="search-results" role="listbox"></span></label></header>
    <div class="site-grid">
      {% include nav.html %}
      <main id="article" class="article">{{ content }}</main>
      {% if page.infobox %}{% include infobox.html %}{% endif %}
    </div>
    <footer>SOA Wiki · Official public lore archive · <a href="{{ '/wiki/about/' | relative_url }}">About</a></footer>
    <script src="{{ '/assets/wiki/wiki.js' | relative_url }}"></script>
  </body>
</html>
